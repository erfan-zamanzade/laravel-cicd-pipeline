# GitLab CI/CD equivalent of .github/workflows/ci.yml.
#
# The project is hosted on GitHub; this file shows the same pipeline on GitLab
# (shared runners or a self-managed GitLab Runner with the Docker executor).
# It is validated locally with gitlab-ci-local, not run on gitlab.com — see
# README "Verification evidence".

stages: [lint, test, build, scan, publish]

variables:
  PHP_IMAGE: serversideup/php:8.4-cli-alpine3.24-v5.0.5
  LOCAL_IMAGE: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
  COMPOSER_CACHE_DIR: $CI_PROJECT_DIR/.composer-cache

default:
  interruptible: true

.php:
  image: $PHP_IMAGE
  before_script:
    - composer install --no-interaction --no-progress --prefer-dist
  cache:
    key:
      files: [composer.lock]
    paths: [.composer-cache/]
    policy: pull-push

quality:
  stage: lint
  extends: .php
  script:
    - composer validate --strict
    - composer audit --locked
    - vendor/bin/pint --test
    - vendor/bin/phpstan analyse --no-progress --memory-limit=512M

dockerfile:
  stage: lint
  image:
    name: hadolint/hadolint:v2.12.0-alpine
    entrypoint: [""]
  script:
    - hadolint Dockerfile

tests:
  stage: test
  extends: .php
  services:
    - name: postgres:17.11-alpine
      alias: postgres
    - name: redis:7.4.12-alpine
      alias: redis
  variables:
    POSTGRES_DB: app
    POSTGRES_USER: app
    POSTGRES_PASSWORD: ci-only
    DB_CONNECTION: pgsql
    DB_HOST: postgres
    DB_DATABASE: app
    DB_USERNAME: app
    DB_PASSWORD: ci-only
    REDIS_HOST: redis
    CACHE_STORE: redis
    METRICS_STORE: redis
  script:
    - php artisan migrate --force --no-interaction
    - vendor/bin/phpunit --log-junit build/junit.xml
  artifacts:
    when: always
    reports:
      junit: build/junit.xml

build:
  stage: build
  image: docker:29.3
  services: [docker:29.3-dind]
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - >
      docker build
      --build-arg APP_VERSION="${CI_COMMIT_TAG:-0.0.0-$CI_COMMIT_SHORT_SHA}"
      --build-arg APP_COMMIT="$CI_COMMIT_SHA"
      --tag "$LOCAL_IMAGE" .
    - docker push "$LOCAL_IMAGE"

scan:
  stage: scan
  image:
    name: aquasec/trivy:0.67.2
    entrypoint: [""]
  variables:
    TRIVY_USERNAME: $CI_REGISTRY_USER
    TRIVY_PASSWORD: $CI_REGISTRY_PASSWORD
  script:
    - trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$LOCAL_IMAGE"

# Promote the scanned image: main gets a moving tag, version tags get a release tag.
publish:
  stage: publish
  image: docker:29.3
  services: [docker:29.3-dind]
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      variables: { RELEASE_TAG: main }
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
      variables: { RELEASE_TAG: $CI_COMMIT_TAG }
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker pull "$LOCAL_IMAGE"
    - docker tag "$LOCAL_IMAGE" "$CI_REGISTRY_IMAGE:$RELEASE_TAG"
    - docker push "$CI_REGISTRY_IMAGE:$RELEASE_TAG"
